<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174e44"><title>SarNi · Quick Entry</title><link rel="icon" href="../sarni-life-icon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5f3;color:#213c35;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}main{max-width:520px;margin:16px auto;background:white;border-radius:20px;box-shadow:0 8px 30px #152f2415;padding:22px}header{display:flex;align-items:center;gap:10px}header img{width:36px;height:36px}h1{font-size:21px;margin:0}p{color:#597269;font-size:13px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 0}button{border:1px solid #d3e0da;background:#f3f8f5;border-radius:10px;padding:11px 9px;color:#214d40;font-weight:700;cursor:pointer}button.selected,.save{background:#14725a;color:white;border-color:#14725a}label{display:block;font-weight:650;margin:12px 0 6px;font-size:13px}input,select,textarea{width:100%;border:1px solid #c4d4cc;border-radius:10px;padding:11px;font:inherit;background:white;color:#213c35}input[type=checkbox]{width:auto;margin-right:7px}textarea{min-height:105px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{min-width:0}.actions{display:flex;gap:10px;margin:16px 0 0}.actions button{flex:1}.error{color:#ab2935!important}.success{color:#167054!important}#status{min-height:20px;margin-top:12px}.hint{font-size:12px} [hidden]{display:none!important}@media(max-width:420px){main{padding:16px;margin:0}body{padding:8px}.grid{grid-template-columns:1fr}} </style><script src="../config.js"></script></head><body>
<main><header><img src="../sarni-life-icon.svg" alt=""><div><h1>SarNi · Quick Entry</h1><p style="margin:3px 0">Expense · Diary · Stock Note</p></div></header><p class="hint">Private shared link. No sign-in required.</p><nav id="tabs" hidden></nav><form id="entry" hidden><div id="fields"></div><div class="actions"><button type="submit" class="save" id="save">Save entry</button><button type="button" id="reset">Add another</button></div></form><p id="status" role="status">Verifying private link…</p><p class="hint">Only share this link with people you trust. The administrator may disable it at any time.</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const key=new URLSearchParams(location.search).get('key')||'';const base=String(window.PORTFOLIO_CONFIG?.API_URL||'');let info=null,mode='expense',busy=false;const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(msg,error=false){$('status').textContent=msg;$('status').className=error?'error':'';}
function api(action,payload={}){return new Promise((resolve,reject)=>{const id='mfreq_'+Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>b.toString(16).padStart(2,'0')).join('');const frame=document.createElement('iframe');frame.name=id;frame.style.display='none';const form=document.createElement('form');form.method='POST';form.action=base;form.target=id;form.style.display='none';const input=document.createElement('input');input.name='payload';input.value=JSON.stringify({action,...payload,linkToken:key,transport:'hybrid',requestId:id,clientOrigin:location.origin});form.append(input);document.body.append(frame,form);let done=false;const cleanup=()=>{window.removeEventListener('message',receive);clearTimeout(timer);form.remove();frame.remove();};const finish=(value,err)=>{if(done)return;done=true;cleanup();err?reject(err):value?.ok?resolve(value):reject(Error(value?.message||'Request failed'));};const receive=e=>{if(!/^(https:\/\/script\.google\.com|https:\/\/([^.]+\.)*googleusercontent\.com)$/.test(e.origin))return;const m=e.data;if(m?.__myfinanceDirectResult===true&&m.requestId===id)finish(m.payload);};window.addEventListener('message',receive);const timer=setTimeout(()=>finish(null,Error('Request timed out. Check whether the entry was saved before trying again.')),55000);try{form.submit();}catch(e){finish(null,e);}});}
function render(){const access=info.quickAccess||{};const types=[['expense','₹ Expense',access.allowExpense],['diary','✎ Diary',access.allowDiary],['stock','▥ Stock',access.allowStock]].filter(x=>x[2]);if(!types.length){status('No entry types are enabled for this link.',true);return;}if(!types.some(x=>x[0]===mode))mode=types[0][0];$('tabs').hidden=false;$('entry').hidden=false;$('tabs').innerHTML=types.map(x=>'<button type="button" data-mode="'+x[0]+'" class="'+(mode===x[0]?'selected':'')+'">'+x[1]+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});const opts=(info.categories||[]).map(c=>'<option>'+safe(c.name)+'</option>').join('');if(mode==='expense'){$('fields').innerHTML='<div class="grid"><div><label>Amount ₹</label><input name="amount" type="number" min="0.01" step=".01" required inputmode="decimal"></div><div><label>Date</label><input name="dateSpent" type="date" required value="'+today()+'"></div></div><label>Category</label><select name="category" required><option value="">Choose</option>'+opts+'</select><label>Subcategory</label><select name="subcategory"><option value="">None</option></select><label>Reason</label><input name="reason" required maxlength="220"><div class="grid"><div><label>Paid by</label><input name="paidBy" maxlength="100" required></div><div><label>Paid to</label><input name="paidTo" maxlength="140"></div></div><label>Debited from</label><input name="debitedFrom" maxlength="100"><label>Notes</label><textarea name="notes" maxlength="700"></textarea>';const cat=$('fields').querySelector('[name=category]');cat.onchange=()=>{const c=(info.categories||[]).find(v=>v.name===cat.value);$('fields').querySelector('[name=subcategory]').innerHTML='<option value="">None</option>'+(c?.subcategories||[]).map(v=>'<option>'+safe(typeof v==='string'?v:v.name)+'</option>').join('');};}
else {$('fields').innerHTML='<label>Date</label><input name="entryDate" type="date" required value="'+today()+'"><label>Title</label><input name="title" maxlength="120"><label>'+(mode==='stock'?'Stock observation':'Diary entry')+'</label><textarea name="text" required maxlength="4500"></textarea><label><input type="checkbox" name="important"> Important entry</label><label><input type="checkbox" name="monthlyHighlight"> Monthly highlight</label><label>Tags</label><input name="tags" maxlength="300">';}status('');}
$('reset').onclick=render;$('entry').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('save').disabled=true;status('Saving…');try{const data=Object.fromEntries(new FormData(e.target));const entryId=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');const r=mode==='expense'?await api('qeSubmit',{entryId,expense:{...data,amount:Number(data.amount)}}):await api('qeQuickNote',{entryId,entry:{...data,kind:mode,important:!!data.important,monthlyHighlight:!!data.monthlyHighlight}});status(r.message||'✓ Saved successfully.');$('entry').reset();$('fields').querySelector('[type=date]').value=today();}catch(err){status(err.message||String(err),true);}finally{busy=false;$('save').disabled=false;}};
(async()=>{try{if(!key)throw Error('Open the private link generated in SarNi Admin Settings.');if(!base)throw Error('Backend is not configured.');info=await api('qeInfo');render();}catch(e){status(e.message,true);}})();
})();
</script></body></html>
