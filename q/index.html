<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174e44"><title>SarNi · Quick Entry</title><link rel="icon" href="../sarni-life-icon.svg"><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:light;--ink:#203d37;--muted:#61766e;--primary:#176b54;--line:#d7e4dd;--surface:#fff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#edf5f1,#f5f7fa);color:var(--ink);font-size:15px;line-height:1.45;padding:clamp(8px,2vw,22px);min-height:100vh}
main{max-width:560px;margin:12px auto;background:var(--surface);border:1px solid #e0eae4;border-radius:19px;box-shadow:0 10px 32px #1b453518;padding:clamp(16px,3vw,25px)}
header{display:flex;align-items:center;gap:11px;padding-bottom:12px;border-bottom:1px solid #edf1ee}
header img{width:39px;height:39px;flex:none}
h1{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.3px;margin:0}
p{color:var(--muted);font-size:12.5px;line-height:1.45;margin:7px 0}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:15px 0}
button{border:1px solid #d6e4dc;background:#f5f9f6;border-radius:10px;padding:10px;color:#285847;font-weight:700;font-size:13px;line-height:1.3;min-height:42px;cursor:pointer;transition:background .15s,border-color .15s}
button.selected,.save{background:var(--primary);color:#fff;border-color:var(--primary)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #258b70;outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
label{display:block;font-weight:650;margin:10px 0 4px;font-size:12.5px;color:#34574c}
input,select,textarea{width:100%;min-height:42px;border:1px solid #cfddd5;border-radius:9px;padding:9px 11px;font:inherit;font-size:15px;background:#fff;color:#213b33}
input::placeholder,textarea::placeholder{color:#84988d}
input[type=checkbox]{appearance:checkbox!important;-webkit-appearance:checkbox!important;min-height:16px;width:16px;height:16px;vertical-align:middle;margin:0 7px 0 0;accent-color:var(--primary)}
textarea{min-height:105px;resize:vertical;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{min-width:0}
.actions{display:flex;gap:8px;margin:15px 0 0}.actions button{flex:1}
#newHeadToggle{margin:7px 0}#newHeadBtn{min-height:34px;padding:7px 11px;background:#eef6f0;color:#235e47;font-size:12px}
#newHeadBox{padding:8px 10px 12px;background:#f5faf6;border:1px solid var(--line);border-radius:10px}
#status{min-height:19px;margin-top:12px;font-size:13px;font-weight:600}
.error{color:#ae3138!important}.success{color:#167151!important}
.hint{font-size:12px;color:#75877e}
[hidden]{display:none!important}
@media(max-width:420px){body{padding:7px}main{margin:0;border-radius:15px;padding:14px}h1{font-size:19px}nav{gap:5px;margin:12px 0}nav button{font-size:12px;padding:9px 4px}label{margin-top:9px}.grid{gap:8px}input,select,textarea{font-size:16px}}
@media(max-width:350px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style><script src="../config.js"></script></head><body>
<main><header><img src="../sarni-life-icon.svg" alt=""><div><h1>SarNi · Quick Entry</h1><p style="margin:3px 0">Expense · Diary · Stock Note</p></div></header><p class="hint">Private shared link. No sign-in required.</p><nav id="tabs" hidden></nav><form id="entry" hidden><div id="fields"></div><div class="actions"><button type="submit" class="save" id="save">Save entry</button><button type="button" id="reset">Add another</button></div></form><p id="status" role="status">Verifying private link…</p><p class="hint">Only share this link with people you trust. The administrator may disable it at any time.</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const key=new URLSearchParams(location.search).get('key')||'';const base=String(window.PORTFOLIO_CONFIG?.API_URL||'');let info=null,mode='expense',busy=false;const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(msg,error=false){$('status').textContent=msg;$('status').className=error?'error':'';}
function api(action,payload={}){return new Promise((resolve,reject)=>{const id='mfreq_'+Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>b.toString(16).padStart(2,'0')).join('');const frame=document.createElement('iframe');frame.name=id;frame.style.display='none';const form=document.createElement('form');form.method='POST';form.action=base;form.target=id;form.style.display='none';const input=document.createElement('input');input.name='payload';input.value=JSON.stringify({action,...payload,linkToken:key,transport:'hybrid',requestId:id,clientOrigin:location.origin});form.append(input);document.body.append(frame,form);let done=false;const cleanup=()=>{window.removeEventListener('message',receive);clearTimeout(timer);form.remove();frame.remove();};const finish=(value,err)=>{if(done)return;done=true;cleanup();err?reject(err):value?.ok?resolve(value):reject(Error(value?.message||'Request failed'));};const receive=e=>{if(!/^(https:\/\/script\.google\.com|https:\/\/([^.]+\.)*googleusercontent\.com)$/.test(e.origin))return;const m=e.data;if(m?.__myfinanceDirectResult===true&&m.requestId===id)finish(m.payload);};window.addEventListener('message',receive);const timer=setTimeout(()=>finish(null,Error('Request timed out. Check whether the entry was saved before trying again.')),55000);try{form.submit();}catch(e){finish(null,e);}});}
function render(){const access=info.quickAccess||{};const types=[['expense','₹ Expense',access.allowExpense],['diary','✎ Diary',access.allowDiary],['stock','▥ Stock',access.allowStock]].filter(x=>x[2]);if(!types.length){status('No entry types are enabled for this link.',true);return;}if(!types.some(x=>x[0]===mode))mode=types[0][0];$('tabs').hidden=false;$('entry').hidden=false;$('tabs').innerHTML=types.map(x=>'<button type="button" data-mode="'+x[0]+'" class="'+(mode===x[0]?'selected':'')+'">'+x[1]+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});const opts=(info.categories||[]).map(c=>'<option>'+safe(c.name)+'</option>').join('');if(mode==='expense'){$('fields').innerHTML='<div class="grid"><div><label>Amount ₹</label><input name="amount" type="number" min="0.01" step=".01" required inputmode="decimal"></div><div><label>Date</label><input name="dateSpent" type="date" required value="'+today()+'"></div></div><label>Expense head (category)</label><select name="category" required><option value="">Choose</option>'+opts+'</select><div id="newHeadBox" hidden><label>New expense head</label><input id="newHeadName" maxlength="79" placeholder="e.g. Home Renovation"></div><div id="newHeadToggle" hidden><button id="newHeadBtn" type="button">＋ New expense head</button></div><label>Subcategory</label><select name="subcategory"><option value="">None</option></select><label>Reason</label><input name="reason" required maxlength="220"><div class="grid"><div><label>Paid by</label><input name="paidBy" maxlength="100" required></div><div><label>Paid to</label><input name="paidTo" maxlength="140"></div></div><label>Debited from</label><input name="debitedFrom" maxlength="100"><label>Notes</label><textarea name="notes" maxlength="700"></textarea>';const cat=$('fields').querySelector('[name=category]');if(info.quickAccess?.allowNewHead){$('newHeadToggle').hidden=false;const b=$('newHeadBtn');b.onclick=()=>{const box=$('newHeadBox');box.hidden=!box.hidden;cat.required=box.hidden;cat.disabled=!box.hidden;b.textContent=box.hidden?'＋ New expense head':'Use existing head';if(!box.hidden)$('newHeadName').focus();};}cat.onchange=()=>{const c=(info.categories||[]).find(v=>v.name===cat.value);$('fields').querySelector('[name=subcategory]').innerHTML='<option value="">None</option>'+(c?.subcategories||[]).map(v=>'<option>'+safe(typeof v==='string'?v:v.name)+'</option>').join('');};}
else {$('fields').innerHTML='<label>Date</label><input name="entryDate" type="date" required value="'+today()+'"><label>Title</label><input name="title" maxlength="120"><label>'+(mode==='stock'?'Stock observation':'Diary entry')+'</label><textarea name="text" required maxlength="4500"></textarea><label><input type="checkbox" name="important"> Important entry</label><label><input type="checkbox" name="monthlyHighlight"> Monthly highlight</label><label>Tags</label><input name="tags" maxlength="300">';}status('');}
$('reset').onclick=render;$('entry').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('save').disabled=true;status('Saving…');try{const data=Object.fromEntries(new FormData(e.target));const entryId=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');const creatingHead=mode==='expense'&&!$('newHeadBox').hidden; if(creatingHead){const h=$('newHeadName').value.trim();if(h.length<2)throw Error('Enter a new expense head name.');data.category=h;data.subcategory='';data.createNewHead=true;}const r=mode==='expense'?await api('qeSubmit',{entryId,expense:{...data,amount:Number(data.amount)}}):await api('qeQuickNote',{entryId,entry:{...data,kind:mode,important:!!data.important,monthlyHighlight:!!data.monthlyHighlight}});status(r.message||'✓ Saved successfully.');$('entry').reset();$('fields').querySelector('[type=date]').value=today();}catch(err){status(err.message||String(err),true);}finally{busy=false;$('save').disabled=false;}};
(async()=>{try{if(!key)throw Error('Open the private link generated in SarNi Admin Settings.');if(!base)throw Error('Backend is not configured.');info=await api('qeInfo');render();}catch(e){status(e.message,true);}})();
})();
</script></body></html>
