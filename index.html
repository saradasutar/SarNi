<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142954">
  <meta name="color-scheme" content="light">
  <meta name="description" content="SarNi personal life dashboard - diary, calendar, expenses and memories">
  <meta name="sarni-build" content="20261016-direct-launch-fix">
  <link rel="manifest" href="./manifest.webmanifest?v=20261016" type="application/manifest+json">
  <link rel="icon" href="./sarni-life-icon.svg?v=20261016-direct" type="image/svg+xml">
  <title>Opening SarNi · Personal Life Dashboard</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 0%,#e8f8f6,transparent 42%),radial-gradient(ellipse at 95% 85%,#ece9ff,transparent 48%),#f7f9fd;color:#182849}
    .card{width:min(440px,100%);padding:34px 28px 30px;border-radius:26px;border:1px solid #e0e6f2;background:#fff;box-shadow:0 24px 76px rgba(24,36,80,.09);text-align:center}
    .icon{width:78px;height:78px;margin:0 auto 13px;display:block}
    h1{font-size:27px;margin:0;letter-spacing:-.045em}p{color:#64728b;margin:11px 0 0;font-size:14px;line-height:1.6}
    .bar{height:4px;background:#e8edf5;border-radius:8px;overflow:hidden;margin:23px auto;max-width:230px}.bar:before{content:"";display:block;width:48%;height:100%;border-radius:8px;background:linear-gradient(90deg,#14a994,#7063e8);animation:move 1.3s ease-in-out infinite alternate}
    @keyframes move{to{transform:translateX(110%)}}
    a.open{display:block;border:0;border-radius:14px;background:#166f70;color:#fff;text-align:center;text-decoration:none;padding:14px 18px;font-weight:800;font-size:15px;box-shadow:0 9px 26px rgba(13,104,100,.16)}
    a.open:hover,a.open:focus-visible{background:#125d60;outline:3px solid #c7f1e7;outline-offset:2px}
    .hint{font-size:12px;color:#7a8597;margin-top:15px}
    @media(prefers-reduced-motion:reduce){.bar:before{animation:none}}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./sarni-life-icon.svg?v=20261016-direct" alt="SarNi" width="78" height="78">
    <h1>Opening SarNi</h1>
    <p id="message">Opening your secure personal life dashboard directly…</p>
    <div class="bar" aria-hidden="true"></div>
    <a class="open" id="directLink" href="https://script.google.com/macros/s/AKfycbwXA1YBWRfOjYvZwDz9dkCr4HZujn9D_YoPmQyjggZxR5hUUs1ZsARytOX8rUR4zRbs/exec?app=1&amp;v=20700-life-manager">Open SarNi Dashboard <span aria-hidden="true">↗</span></a>
    <p class="hint">If the dashboard does not open automatically, select the button above. Sign in with your authorised account if Google asks.</p>
  </main>
  <script>
    (function(){
      var url=document.getElementById('directLink').href;
      var manual=new URLSearchParams(location.search).has('manual');
      if(!manual){setTimeout(function(){location.replace(url);},750);}
      else{document.getElementById('message').textContent='Select the button below to open SarNi securely.';}
    })();
  </script>
</body>
</html>
