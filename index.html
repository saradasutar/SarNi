<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17285f">
  <title>My Finance</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10204f}
    #app{width:100%;height:100%;border:0;display:block;background:#fff}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#10204f,#36277d);color:#fff;font:700 15px system-ui;z-index:2}
    #loading small{display:block;margin-top:8px;font-weight:500;opacity:.8;text-align:center}
    #fallback{position:fixed;right:16px;bottom:16px;z-index:3;padding:9px 12px;border-radius:10px;background:#fff;color:#303c66;text-decoration:none;font:700 12px system-ui;box-shadow:0 5px 20px rgba(0,0,0,.18)}
  </style>
</head>
<body>
  <div id="loading"><div>Opening My Finance…<small>Native Google Apps Script connection · V20.0</small></div></div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbxxU49CVveyCzXq7qbwPx4AAkxcgH6s8-xPexlRm0u1bSsOnAHyMryvx9zxbmGJ5m-U/exec?app=1&v=2000" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <a id="fallback" href="https://script.google.com/macros/s/AKfycbxxU49CVveyCzXq7qbwPx4AAkxcgH6s8-xPexlRm0u1bSsOnAHyMryvx9zxbmGJ5m-U/exec?app=1&v=2000" target="_blank" rel="noopener">Open directly</a>
  <script>
    const f=document.getElementById('app'),l=document.getElementById('loading');
    f.addEventListener('load',()=>setTimeout(()=>l.style.display='none',350));
  </script>
</body>
</html>
