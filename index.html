<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta name="theme-color" content="#111a3b">
  <meta name="description" content="SarNi family portfolio dashboard">
  <meta name="sarni-build" content="20260830-19601-namedviews1">
  <title>SarNi</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f5f7ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    #sarniFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f5f7ff}
    #opening{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;color:#28345d;background:radial-gradient(circle at 20% 15%,#e8e5ff,transparent 35%),linear-gradient(145deg,#edf5ff,#faf7ff);text-align:center;transition:opacity .25s ease}
    #opening.done{pointer-events:none;opacity:0}
    .opening-card{width:min(430px,92vw);padding:30px;border:1px solid #dce2f2;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 24px 70px rgba(32,43,90,.16)}
    .mark{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 14px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#18b8b0,#7358e4);font-size:30px;font-weight:900;box-shadow:0 13px 30px rgba(91,92,226,.25)}
    h1{margin:0;color:#182344;font-size:27px}p{margin:9px 0 0;color:#697792;font-size:14px;font-weight:700;line-height:1.5}
    .loader{width:42px;height:42px;margin:22px auto 0;border:4px solid #e1e5f2;border-top-color:#6557dd;border-radius:50%;animation:spin .8s linear infinite}
    #directLink{display:none;margin:18px auto 0;padding:11px 15px;border:0;border-radius:11px;color:#fff;background:#5d50d1;font-weight:850;text-decoration:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="opening" role="status" aria-live="polite"><div class="opening-card"><div class="mark">₹</div><h1>Opening SarNi</h1><p id="openingMessage">Preparing your saved portfolio views…</p><div class="loader" aria-hidden="true"></div><a id="directLink" href="https://script.google.com/macros/s/AKfycbwXA1YBWRfOjYvZwDz9dkCr4HZujn9D_YoPmQyjggZxR5hUUs1ZsARytOX8rUR4zRbs/exec?app=1&amp;v=19601-namedviews1">Open directly</a></div></div>
  <iframe id="sarniFrame" title="SarNi Financial Command Centre" src="https://script.google.com/macros/s/AKfycbwXA1YBWRfOjYvZwDz9dkCr4HZujn9D_YoPmQyjggZxR5hUUs1ZsARytOX8rUR4zRbs/exec?app=1&amp;embedded=1&amp;v=19601-namedviews1" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (function(){
      var frame=document.getElementById('sarniFrame'),opening=document.getElementById('opening'),message=document.getElementById('openingMessage'),direct=document.getElementById('directLink');
      frame.addEventListener('load',function(){setTimeout(function(){opening.classList.add('done')},350)});
      setTimeout(function(){if(opening.classList.contains('done'))return;message.textContent='The secure dashboard is taking longer than usual. You may continue waiting or open it directly.';direct.style.display='inline-block'},15000);
    })();
  </script>
</body>
</html>
